name: Feature
description: Add or change a product, pipeline, or MLOps capability.
title: "feat: "
labels:
  - type:feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user or engineering problem.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List included and explicitly excluded work.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide observable completion conditions.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: List tests, metrics, and rollback checks.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data and license review
      options:
        - label: Sensitive data and model license impact were reviewed.
          required: true
