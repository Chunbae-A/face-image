name: repository-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-api-test.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Verify generated Colab notebook
        run: |
          python scripts/build_celebdf_colab_notebook.py
          git diff --exit-code -- notebooks/celebdf_arcface_full_colab.ipynb

      - name: Verify generated deepfake Colab notebook
        run: |
          python scripts/build_celebdf_deepfake_colab_notebook.py
          git diff --exit-code -- notebooks/celebdf_efficientnet_b4_colab.ipynb

      - name: Verify generated deepfake Kaggle notebooks
        run: |
          python scripts/build_celebdf_deepfake_kaggle_notebooks.py
          git diff --exit-code -- \
            notebooks/celebdf_deepfake_preprocess_kaggle.ipynb \
            notebooks/celebdf_deepfake_train_kaggle.ipynb
