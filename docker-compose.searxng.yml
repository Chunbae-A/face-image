services:
  faceguard-api:
    environment:
      FACEGUARD_SEARXNG_BASE_URL: "http://searxng:8080"
      FACEGUARD_SEARCH_PROVIDER_TIMEOUT_SECONDS: "${FACEGUARD_SEARCH_PROVIDER_TIMEOUT_SECONDS:-12.0}"
      FACEGUARD_SEARXNG_REQUEST_TIMEOUT_SECONDS: "${FACEGUARD_SEARXNG_REQUEST_TIMEOUT_SECONDS:-4.0}"
      FACEGUARD_SEARXNG_MAXIMUM_RETRIES: "${FACEGUARD_SEARXNG_MAXIMUM_RETRIES:-1}"
      FACEGUARD_SEARXNG_RETRY_BACKOFF_SECONDS: "${FACEGUARD_SEARXNG_RETRY_BACKOFF_SECONDS:-0.25}"
    depends_on:
      searxng:
        condition: service_healthy

  searxng:
    image: "${SEARXNG_IMAGE:-ghcr.io/searxng/searxng:2026.5.10-df1f24fb7}"
    environment:
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-local-demo-only-change-before-sharing}"
    expose:
      - "8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--proxy=off", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
