services:
  faceguard-api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FACEGUARD_ACCEPT_NONCOMMERCIAL_MODEL_LICENSE: "${FACEGUARD_ACCEPT_NONCOMMERCIAL_MODEL_LICENSE:-false}"
      FACEGUARD_DEVICE: "${FACEGUARD_DEVICE:-cpu}"
      FACEGUARD_THRESHOLD_STATUS: "${FACEGUARD_THRESHOLD_STATUS:-research_only_unapproved}"
      FACEGUARD_MAX_VIDEO_BYTES: "${FACEGUARD_MAX_VIDEO_BYTES:-52428800}"
      FACEGUARD_MAX_VIDEO_SECONDS: "${FACEGUARD_MAX_VIDEO_SECONDS:-120}"
      FACEGUARD_MAX_VIDEO_REQUEST_BYTES: "${FACEGUARD_MAX_VIDEO_REQUEST_BYTES:-95420416}"
      FACEGUARD_RETRIEVAL_SIMILARITY_THRESHOLD: "${FACEGUARD_RETRIEVAL_SIMILARITY_THRESHOLD:-0.20}"
      FACEGUARD_MAX_SEARCH_CANDIDATES: "${FACEGUARD_MAX_SEARCH_CANDIDATES:-100}"
      FACEGUARD_SEARCH_PROVIDER_TIMEOUT_SECONDS: "${FACEGUARD_SEARCH_PROVIDER_TIMEOUT_SECONDS:-12.0}"
      FACEGUARD_MAXIMUM_PIPELINE_CANDIDATES: "${FACEGUARD_MAXIMUM_PIPELINE_CANDIDATES:-10}"
      FACEGUARD_CANDIDATE_DOWNLOAD_TIMEOUT_SECONDS: "${FACEGUARD_CANDIDATE_DOWNLOAD_TIMEOUT_SECONDS:-4.0}"
      FACEGUARD_CANDIDATE_DOWNLOAD_MAXIMUM_REDIRECTS: "${FACEGUARD_CANDIDATE_DOWNLOAD_MAXIMUM_REDIRECTS:-2}"
      FACEGUARD_DEEPFAKE_MODEL_PATH: "/models/deepfake/efficientnet_b4.onnx"
      FACEGUARD_DEEPFAKE_MODEL_SHA256: "${FACEGUARD_DEEPFAKE_MODEL_SHA256:-c32a8532e2e1bd275b833b16460946eb307207098e0c07e2247851b71c23a6f1}"
      FACEGUARD_DEEPFAKE_DEVICE: "${FACEGUARD_DEEPFAKE_DEVICE:-cpu}"
      FACEGUARD_DEEPFAKE_THRESHOLD: "${FACEGUARD_DEEPFAKE_THRESHOLD:-0.7519882693886758}"
      FACEGUARD_DEEPFAKE_THRESHOLD_STATUS: "${FACEGUARD_DEEPFAKE_THRESHOLD_STATUS:-research_only_single_image_unvalidated}"
      FACEGUARD_DEEPFAKE_VIDEO_FRAME_COUNT: "${FACEGUARD_DEEPFAKE_VIDEO_FRAME_COUNT:-16}"
      FACEGUARD_DEEPFAKE_VIDEO_MINIMUM_VALID_FRAMES: "${FACEGUARD_DEEPFAKE_VIDEO_MINIMUM_VALID_FRAMES:-4}"
      FACEGUARD_DEEPFAKE_VIDEO_THRESHOLD_STATUS: "${FACEGUARD_DEEPFAKE_VIDEO_THRESHOLD_STATUS:-research_only_unapproved}"
    volumes:
      - faceguard-models:/models
      - "${FACEGUARD_DEEPFAKE_MODEL_HOST_DIR:-./.models/deepfake}:/models/deepfake:ro"
    restart: unless-stopped

volumes:
  faceguard-models:
